<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5">

  <title>Menu | Sushic Biella</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    .page {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 24px 50px;
    }

    .back {
      display: inline-block;
      margin-bottom: 45px;
      color: #777;
      text-decoration: none;
      font-size: 15px;
    }

    .header {
      text-align: center;
      margin-bottom: 45px;
    }

    .brand {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 6px;
    }

    .location {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #888;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 0 0 30px;
    }

    .button {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 82px;
      padding: 18px 20px;
      margin-bottom: 14px;

      background: #fff;
      color: #111;
      text-decoration: none;

      border: 1px solid #e7e7e7;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }

    .icon {
      width: 45px;
      font-size: 24px;
      margin-right: 14px;
      text-align: center;
    }

    .text {
      flex: 1;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
    }

    .description {
      margin-top: 4px;
      font-size: 13px;
      color: #888;
    }

    .arrow {
      color: #aaa;
      font-size: 22px;
    }

    .button:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      margin-top: 55px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

<main class="page">

  <a class="back" href="biella.html">‹ Torna a Sushic Biella</a>

  <div class="header">
    <div class="brand">SUSHIC</div>
    <div class="location">BIELLA</div>
  </div>

  <h1>Scegli il menu</h1>

  <a class="button" href="https://portal.pointsme.it/flyer/#/menu-preview/194429408173092871">
    <div class="icon">☀️</div>
    <div class="text">
      <div class="title">Pranzo Feriale</div>
      <div class="description">Lunedì – Venerdì</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button" href="https://portal.pointsme.it/flyer/#/menu-preview/196300942320013313">
    <div class="icon">🎉</div>
    <div class="text">
      <div class="title">Pranzo Festivo</div>
      <div class="description">Sabato, Domenica e Festivi</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button" href="https://portal.pointsme.it/flyer/#/menu-preview/194429408173092875">
    <div class="icon">🌙</div>
    <div class="text">
      <div class="title">Cena</div>
      <div class="description">Menu Serale</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button" href="https://sushic.it/ordina-online/">
    <div class="icon">🥡</div>
    <div class="text">
      <div class="title">Ordina Asporto online</div>
      <div class="description">sconto 20% per ritiro e 10% per consegna a casa</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <footer>© Sushic Italy</footer>

</main>

</body>
</html>
