<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5">

  <title>Menu | Sushic Biella</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B30JEWQ1T8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-B30JEWQ1T8");
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 24px 50px;
    }

    /* =========================
       语言下拉菜单
       ========================= */

    .language-menu {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 1000;
      text-align: left;
    }

    .language-current {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      min-width: 82px;
      padding: 8px 10px;

      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;

      color: #333;

      font-family: inherit;
      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .language-current:active {
      transform: scale(0.98);
    }

    .current-flag {
      font-size: 17px;
      line-height: 1;
    }

    .language-arrow {
      margin-left: 1px;
      color: #999;
      font-size: 9px;
      transition: transform 0.2s ease;
    }

    .language-menu.open .language-arrow {
      transform: rotate(180deg);
    }

    .language-dropdown {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;

      width: 105px;
      padding: 6px;

      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 12px;

      box-shadow: 0 8px 25px rgba(0,0,0,0.10);

      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px);

      transition:
        opacity 0.18s ease,
        transform 0.18s ease,
        visibility 0.18s ease;
    }

    .language-menu.open .language-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .language-option {
      display: flex;
      align-items: center;
      gap: 9px;

      width: 100%;
      padding: 10px 9px;

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: #333;

      font-family: inherit;
      font-size: 13px;
      font-weight: 500;

      text-align: left;
      cursor: pointer;
    }

    .language-option:hover {
      background: #f5f5f3;
    }

    .language-option.active {
      background: #f2f2f0;
      font-weight: 600;
    }

    .language-option .flag {
      font-size: 18px;
      line-height: 1;
    }

    /* =========================
       返回
       ========================= */

    .back {
      display: inline-block;
      margin-bottom: 45px;
      padding-top: 5px;

      color: #777;
      text-decoration: none;
      font-size: 15px;
    }

    /* =========================
       LOGO
       ========================= */

    .header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .logo {
      display: block;
      width: 180px;
      max-width: 65%;
      height: auto;
    }

    .location {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #888;
    }

    /* =========================
       标题
       ========================= */

    h1 {
      text-align: center;
      font-size: 22px;
      margin: 0 0 30px;
    }

    /* =========================
       菜单按钮
       ========================= */

    .button {
      display: flex;
      align-items: center;

      width: 100%;
      min-height: 82px;

      padding: 18px 20px;
      margin-bottom: 14px;

      background: #fff;
      color: #111;
      text-decoration: none;

      border: 1px solid #e7e7e7;
      border-radius: 16px;

      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }

    .icon {
      width: 45px;
      font-size: 24px;
      margin-right: 14px;
      text-align: center;
    }

    .text {
      flex: 1;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
    }

    .description {
      margin-top: 4px;
      font-size: 13px;
      color: #888;
    }

    .arrow {
      color: #aaa;
      font-size: 22px;
    }

    .button:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      margin-top: 55px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

<main class="page">

  <!-- =========================
       语言选择
       ========================= -->

  <div class="language-menu" id="languageMenu">

    <button
      class="language-current"
      type="button"
      onclick="toggleLanguageMenu(event)"
      aria-label="Select language">

      <span class="current-flag" id="currentFlag">🇮🇹</span>
      <span id="currentLanguage">IT</span>
      <span class="language-arrow">▼</span>

    </button>

    <div class="language-dropdown">

      <button
        class="language-option"
        id="option-it"
        type="button"
        onclick="setLanguage('it')">

        <span class="flag">🇮🇹</span>
        <span>IT</span>

      </button>

      <button
        class="language-option"
        id="option-en"
        type="button"
        onclick="setLanguage('en')">

        <span class="flag">🇬🇧</span>
        <span>EN</span>

      </button>

      <button
        class="language-option"
        id="option-zh"
        type="button"
        onclick="setLanguage('zh')">

        <span class="flag">🇨🇳</span>
        <span>中文</span>

      </button>

    </div>

  </div>


  <!-- 返回 Biella -->

  <a
    class="back"
    href="biella.html"
    id="backText">
    ‹ Torna a Sushic Biella
  </a>


  <!-- LOGO -->

  <div class="header">

    <div class="logo-wrap">

      <img
        src="sushic-logo.png"
        alt="Sushic Asian Experience"
        class="logo">

    </div>

    <div class="location">
      BIELLA
    </div>

  </div>


  <!-- 页面标题 -->

  <h1 id="pageTitle">
    Scegli il menu
  </h1>


  <!-- =========================
       PRANZO FERIALE
       ========================= -->

  <a
    class="button"
    href="https://portal.pointsme.it/flyer/#/menu-preview/194429161212477447"
    target="_blank"
    rel="noopener"
    onclick="trackMenuSelection('weekday_lunch')">

    <div class="icon">☀️</div>

    <div class="text">

      <div
        class="title"
        id="weekdayTitle">
        Pranzo Feriale
      </div>

      <div
        class="description"
        id="weekdayDescription">
        Lunedì – Venerdì
      </div>

    </div>

    <div class="arrow">›</div>

  </a>


  <!-- =========================
       PRANZO FESTIVO
       ========================= -->

  <a
    class="button"
    href="https://portal.pointsme.it/flyer/#/menu-preview/195646494530805762"
    target="_blank"
    rel="noopener"
    onclick="trackMenuSelection('holiday_lunch')">

    <div class="icon">🎉</div>

    <div class="text">

      <div
        class="title"
        id="holidayTitle">
        Pranzo Festivo
      </div>

      <div
        class="description"
        id="holidayDescription">
        Sabato, Domenica e Festivi
      </div>

    </div>

    <div class="arrow">›</div>

  </a>


  <!-- =========================
       CENA
       ========================= -->

  <a
    class="button"
    href="https://portal.pointsme.it/flyer/#/menu-preview/194429161212477451"
    target="_blank"
    rel="noopener"
    onclick="trackMenuSelection('dinner')">

    <div class="icon">🌙</div>

    <div class="text">

      <div
        class="title"
        id="dinnerTitle">
        Cena
      </div>

      <div
        class="description"
        id="dinnerDescription">
        Menu Serale
      </div>

    </div>

    <div class="arrow">›</div>

  </a>


  <!-- =========================
       ASPORTO
       ========================= -->

  <a
    class="button"
    href="https://sushic.it/ordina-online/"
    target="_blank"
    rel="noopener"
    onclick="trackMenuSelection('takeaway')">

    <div class="icon">🥡</div>

    <div class="text">

      <div
        class="title"
        id="takeawayTitle">
        Ordina da Asporto
      </div>

      <div
        class="description"
        id="takeawayDescription">
        20% di sconto sul ritiro · 10% sulla consegna
      </div>

    </div>

    <div class="arrow">›</div>

  </a>


  <footer>
    © Sushic Italy
  </footer>

</main>


<script>

  /* =========================
     三语言内容
     ========================= */

  const translations = {

    it: {

      back: "‹ Torna a Sushic Biella",

      pageTitle: "Scegli il menu",

      weekdayTitle: "Pranzo Feriale",
      weekdayDescription: "Lunedì – Venerdì",

      holidayTitle: "Pranzo Festivo",
      holidayDescription:
        "Sabato, Domenica e Festivi",

      dinnerTitle: "Cena",
      dinnerDescription: "Menu Serale",

      takeawayTitle: "Ordina da Asporto",
      takeawayDescription:
        "20% di sconto sul ritiro · 10% sulla consegna",

      languageName: "IT",
      flag: "🇮🇹"
    },


    en: {

      back: "‹ Back to Sushic Biella",

      pageTitle: "Choose a menu",

      weekdayTitle: "Weekday Lunch",
      weekdayDescription: "Monday – Friday",

      holidayTitle: "Weekend & Holiday Lunch",
      holidayDescription:
        "Saturday, Sunday and Public Holidays",

      dinnerTitle: "Dinner",
      dinnerDescription: "Evening Menu",

      takeawayTitle: "Order Takeaway",
      takeawayDescription:
        "20% off pickup · 10% off delivery",

      languageName: "EN",
      flag: "🇬🇧"
    },


    zh: {

      back: "‹ 返回 Sushic Biella",

      pageTitle: "选择菜单",

      weekdayTitle: "工作日午餐",
      weekdayDescription: "星期一 – 星期五",

      holidayTitle: "周末及节假日午餐",
      holidayDescription:
        "星期六、星期日及节假日",

      dinnerTitle: "晚餐",
      dinnerDescription: "晚餐菜单",

      takeawayTitle: "外卖点餐",
      takeawayDescription:
        "自取优惠 20% · 配送优惠 10%",

      languageName: "中文",
      flag: "🇨🇳"
    }

  };


  /* =========================
     自动检测系统语言
     ========================= */

  function detectLanguage() {

    const browserLanguage =
      (navigator.languages && navigator.languages[0]) ||
      navigator.language ||
      "it";

    const language =
      browserLanguage.toLowerCase();

    if (language.startsWith("zh")) {
      return "zh";
    }

    if (language.startsWith("en")) {
      return "en";
    }

    if (language.startsWith("it")) {
      return "it";
    }

    return "it";
  }


  /* =========================
     当前语言
     ========================= */

  function getCurrentLanguage() {

    return (
      localStorage.getItem("sushic-language") ||
      detectLanguage()
    );
  }


  /* =========================
     GA4 菜单选择统计
     ========================= */

  function trackMenuSelection(menuType) {

    if (typeof gtag === "function") {

      gtag("event", "menu_selection", {
        restaurant: "biella",
        menu_type: menuType,
        language: getCurrentLanguage(),
        page_type: "menu"
      });

    }
  }


  /* =========================
     打开 / 关闭语言菜单
     ========================= */

  function toggleLanguageMenu(event) {

    event.stopPropagation();

    document
      .getElementById("languageMenu")
      .classList
      .toggle("open");
  }


  /* =========================
     应用语言
     ========================= */

  function applyLanguage(language) {

    const text =
      translations[language];


    document.getElementById("backText").textContent =
      text.back;


    document.getElementById("pageTitle").textContent =
      text.pageTitle;


    document.getElementById("weekdayTitle").textContent =
      text.weekdayTitle;

    document.getElementById("weekdayDescription").textContent =
      text.weekdayDescription;


    document.getElementById("holidayTitle").textContent =
      text.holidayTitle;

    document.getElementById("holidayDescription").textContent =
      text.holidayDescription;


    document.getElementById("dinnerTitle").textContent =
      text.dinnerTitle;

    document.getElementById("dinnerDescription").textContent =
      text.dinnerDescription;


    document.getElementById("takeawayTitle").textContent =
      text.takeawayTitle;

    document.getElementById("takeawayDescription").textContent =
      text.takeawayDescription;


    document.getElementById("currentFlag").textContent =
      text.flag;

    document.getElementById("currentLanguage").textContent =
      text.languageName;


    document.documentElement.lang =
      language === "zh"
        ? "zh-CN"
        : language;


    document
      .querySelectorAll(".language-option")
      .forEach(function(option) {

        option.classList.remove("active");

      });


    document
      .getElementById("option-" + language)
      .classList
      .add("active");
  }


  /* =========================
     手动切换语言 + GA4
     ========================= */

  function setLanguage(language) {

    const previousLanguage =
      getCurrentLanguage();

    localStorage.setItem(
      "sushic-language",
      language
    );

    applyLanguage(language);

    document
      .getElementById("languageMenu")
      .classList
      .remove("open");


    if (
      previousLanguage !== language &&
      typeof gtag === "function"
    ) {

      gtag("event", "language_change", {
        restaurant: "biella",
        page_type: "menu",
        language_from: previousLanguage,
        language_to: language
      });

    }
  }


  /* =========================
     点击外部关闭菜单
     ========================= */

  document.addEventListener(
    "click",
    function(event) {

      const menu =
        document.getElementById("languageMenu");

      if (!menu.contains(event.target)) {

        menu.classList.remove("open");

      }

    }
  );


  /* =========================
     页面加载语言
     ========================= */

  const savedLanguage =
    localStorage.getItem(
      "sushic-language"
    );


  const initialLanguage =
    savedLanguage ||
    detectLanguage();


  applyLanguage(initialLanguage);

</script>

</body>
</html>
