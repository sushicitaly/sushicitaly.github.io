<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5">

  <title>Sushic Biella</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    .page {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 24px 50px;
    }

    .back {
      display: inline-block;
      margin-bottom: 45px;
      color: #777;
      text-decoration: none;
      font-size: 15px;
    }

    .header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .logo {
      display: block;
      width: 180px;
      max-width: 65%;
      height: auto;
    }

    .location {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #888;
    }

    .button {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 20px;
      margin-bottom: 14px;
      background: white;
      color: #111;
      text-decoration: none;
      border: 1px solid #e7e7e7;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }

    .icon {
      width: 45px;
      font-size: 25px;
      text-align: center;
      margin-right: 14px;
    }

    .text {
      flex: 1;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
    }

    .description {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .arrow {
      color: #aaa;
      font-size: 22px;
    }

    .button:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      margin-top: 55px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

<main class="page">

  <a class="back" href="index.html">‹ Scegli un altro ristorante</a>

  <div class="header">
    <div class="logo-wrap">
      <img src="sushic-logo.png" alt="Sushic Asian Experience" class="logo">
    </div>
    <div class="location">BIELLA</div>
  </div>

  <a class="button" href="menu-biella.html">
    <div class="icon">🍣</div>
    <div class="text">
      <div class="title">Menu</div>
      <div class="description">Consulta i nostri menu</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button"
     href="https://maps.app.goo.gl/JZCFM68shUyAX9Hh7?g_st=ic"
     target="_blank"
     rel="noopener">
    <div class="icon">📍</div>
    <div class="text">
      <div class="title">Naviga</div>
      <div class="description">Indicazioni per il ristorante</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button" href="tel:+390153351624">
    <div class="icon">☎️</div>
    <div class="text">
      <div class="title">Chiama</div>
      <div class="description">Contatta il ristorante</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button"
     href="biella.vcf"
     download
     onclick="showContactHelp()">
    <div class="icon">👤</div>
    <div class="text">
      <div class="title">Salva contatto</div>
      <div class="description">Aggiungi Sushic Biella ai contatti</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <footer>© Sushic Italy</footer>

</main>

<script>
function showContactHelp() {
  if (/Android/i.test(navigator.userAgent)) {
    setTimeout(function () {
      alert(
        "Contatto scaricato.\n\n" +
        "Apri il file scaricato per aggiungere SUSHIC Biella ai contatti."
      );
    }, 500);
  }
}
</script>

</body>
</html>
