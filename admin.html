<style>
:root {
  color-scheme: light;
  --ink: #2b211e;
  --muted: #6d5c55;
  --line: #e8dbd2;
  --outline: #af9a8e;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 1rem; }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at 50% 0, #fffbf4, transparent 44rem), var(--ground);

header {
  color: #fff8ed;
  background: linear-gradient(108deg, #291b18, #432820);

}

header div, main {
  max-width: 1080px;
  margin-inline: auto;
  padding-inline: clamp(1rem, 4vw, 2rem);
}

header div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem 1rem;
  flex-wrap: wrap;
  min-height: 76px;
  padding-block: .8rem;
}

h1, h2, h3, p { margin: 0 0 .65rem; }
h1, h2 { font-family: var(--serif); }
h1 {
  display: flex;
  align-items: center;
  gap: .8rem;
  margin: 0;
  font-size: clamp(1.22rem, 3.6vw, 1.65rem);

}

.brand-logo {
  width: 44px;
  height: 44px;

  flex: none;
}

h2 { margin-bottom: 1rem; font-size: clamp(1.24rem, 2.5vw, 1.55rem); line-height: 1.35; }
h3 { margin-bottom: .85rem; font-size: 1.05rem; line-height: 1.4; overflow-wrap: anywhere; }
main { padding-top: clamp(1.2rem, 4vw, 2.4rem); padding-bottom: 4rem; }

section, article {
  min-width: 0;
  margin-bottom: 1rem;
  padding: clamp(1rem, 3.3vw, 1.75rem);
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--paper);
}

section { box-shadow: var(--shadow); }
article { margin-top: .9rem; background: #fbf6f0; }
article:last-child { margin-bottom: 0; }

#login, #recovery {
  max-width: 440px;
  margin: clamp(1.4rem, 7vh, 4.4rem) auto 0;
  padding: clamp(1.25rem, 5vw, 2.2rem);

}

#login .grid, #recovery .grid { grid-template-columns: 1fr; }
#login .actions, #recovery .actions { margin-top: 1.45rem; }

#status {
  padding: .7rem 1rem;
  border: 1px solid #c4d7c7;
  border-radius: 10px;
  color: #2c5238;
  background: #eff6ed;
  overflow-wrap: anywhere;
}

#status:empty, output:empty { display: none; }
#status[data-error="true"] { color: #8e241b; background: #fff0eb; border-color: #edc5b9; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
  gap: 1rem;
}

.wide { grid-column: 1 / -1; }
label { display: grid; min-width: 0; gap: .32rem; font-size: .9rem; font-weight: 600; }
label.check { display: flex; align-items: center; gap: .55rem; min-height: 44px; }
small, .hint { color: var(--muted); font-size: .87rem; font-weight: 400; }
input, select, textarea, button { font: inherit; }

input:not([type=checkbox]), select, textarea {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: .55rem .72rem;
  border: 1px solid var(--outline);

  font-weight: 400;
}

textarea { min-height: 7rem; resize: vertical; }
input[type=checkbox] { width: 1.14rem; height: 1.14rem; margin: 0; accent-color: var(--accent); }
button {
  min-height: 44px;
  padding: .52rem 1rem;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--accent);
  color: white;
  font-size: .92rem;
  font-weight: 650;
  cursor: pointer;
}

button:not(:disabled):hover { background: var(--accent-hover); }
button.secondary { background: transparent; color: var(--accent-hover); border-color: var(--outline); }
button.secondary:not(:disabled):hover { background: #f5e8df; }
#logout { color: #fff8ed; border-color: #be9b8e; }
#logout:not(:disabled):hover { background: #644137; }
button:disabled { opacity: .6; cursor: wait; }
:focus-visible { outline: 2px solid #875042; outline-offset: 3px; }
header :focus-visible { outline-color: #ffe1bf; }

.actions { display: flex; align-items: center; flex-wrap: wrap; gap: .65rem; margin-top: 1.1rem; }
nav { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .95rem; }

  background: #f9efe7;
  color: #7d3026;
  font-size: .87rem;

nav a:hover { background: #f4e1d5; }
output { flex: 1 1 12rem; color: #2c5238; overflow-wrap: anywhere; }
output.error { color: #8e241b; }
#store-select { display: block; max-width: 340px; margin-top: .35rem; }
code { overflow-wrap: anywhere; }

}

.hours legend { padding: 0 .35rem; font-weight: 650; }
.hours .grid { margin-top: .7rem; }
.hours input { font-variant-numeric: tabular-nums; }

@media (max-width: 480px) {
  header div { min-height: 68px; }
  .brand-logo { width: 36px; height: 36px; }
  nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  nav a { justify-content: center; }
}

<script>
'use strict';

const PROJECT_URL = 'https://irhxujhabzqwsjyaejta.supabase.co';
const PUBLISHABLE_KEY = 'sb_publishable_33LPhiwJzy5L3elJCrhPWw_wlNCPcRp';
const $ = id => document.getElementById(id);
const dirty = new Set();
const orderedStores = [];
let db;
let currentStore = '';
let authorized = false;
let busy = false;
let recovering = false;

function element(tag, value, className) {
  const node = document.createElement(tag);
  if (value !== undefined) node.textContent = value;
  if (className) node.className = className;
  return node;
}

function status(message, error = false) {
  $('status').textContent = message;
  $('status').dataset.error = String(error);
}

function message(error) {
  if (error?.code === 'invalid_credentials') return '邮箱或密码有误，请重试。';
  if (error?.code === 'email_not_confirmed') return '请先完成 Supabase 邮箱验证。';
  if (error?.code === '23505') return '该记录已存在。如果其他管理员刚保存过，请重新载入后再试。';
  if (error?.code === '42501') return '数据库拒绝操作，请核对管理员权限和 RLS 策略。';
  return error?.message || '操作失败，请重试。';
}

function result({ data, error }) {
  if (error) throw error;
  return data;
}

function setBusy(value) {
  busy = value;
  $('admin').setAttribute('aria-busy', String(value));
  $('store-select').disabled = value;
  $('login-button').disabled = value;
  $('reset-email').disabled = value;
  $('save-password').disabled = value;
  $('logout').disabled = value;
}

function clearAdmin() {
  authorized = false;
  currentStore = '';
  orderedStores.length = 0;
  dirty.clear();
  $('store-select').replaceChildren();
  $('store-content').replaceChildren();
  $('site').replaceChildren();
  $('admin').hidden = true;
  $('logout').hidden = true;
  recovering = false;
  $('recovery').hidden = true;
  $('login').hidden = false;
}

async function checkAdmin() {
  const allowed = result(await db.rpc('is_admin'));
  if (allowed !== true) {
    clearAdmin();
    const { error } = await db.auth.signOut({ scope: 'local' });
    if (error) throw error;
    throw new Error('此账号没有 Sushic 管理权限。');
  }
}

const details = [
  ['name', '门店名称', 'required'], ['address', '地址'], ['navigation_address', '导航地址'],
  ['phone', '电话', 'tel'], ['email', '门店邮箱', 'email'], ['website', '门店网站', 'url'],
  ['enabled', '启用门店', 'bool'], ['sort_order', '排序', 'int']
];
const menuFields = [
  ['menu_type', '菜单类型', 'required'], ['title_it', '标题 · Italiano'],
  ['title_en', '标题 · English'], ['title_zh', '标题 · 中文'],
  ['adult_price', '成人价格（€）', 'price'], ['child_price', '儿童价格（€）', 'price'],
  ['child_height', '儿童身高（厘米）', 'nonnegative'],
  ['free_under_age', '免费年龄上限（岁）', 'nonnegative'],
  ['menu_url', '菜单链接', 'url'], ['enabled', '启用菜单', 'bool'], ['sort_order', '排序', 'int']
];
const storeSettings = [
  ['takeaway_url', '外卖链接', 'url'], ['takeaway_enabled', '启用外卖', 'bool'],
  ['rules_it', '用餐规则 · Italiano', 'long'], ['rules_en', '用餐规则 · English', 'long'],
  ['rules_zh', '用餐规则 · 中文', 'long'],
  ['announcement_it', '公告 · Italiano', 'long'], ['announcement_en', '公告 · English', 'long'],
  ['announcement_zh', '公告 · 中文', 'long'], ['announcement_enabled', '启用公告', 'bool']
];
const social = [
  ['instagram_url', 'Instagram', 'url'], ['facebook_url', 'Facebook', 'url'],
  ['tiktok_url', 'TikTok', 'url'], ['whatsapp_url', 'WhatsApp', 'url']
];
const appearance = [
  ['background_image_url', '背景图片链接', 'url'],
  ['background_color', '背景颜色（#RRGGBB）', 'color'],
  ['accent_color', '主题颜色（#RRGGBB）', 'color']
];

function field([key, title, type], value) {
  const label = element('label', title);
  const control = element(['long', 'json'].includes(type) ? 'textarea' : 'input');
  control.name = key;
  if (control.tagName === 'INPUT') control.type = ({ bool:'checkbox', tel:'tel', email:'email', url:'url' })[type] || 'text';
  if (type === 'required') control.required = true;
  if (type === 'bool') {
    label.className = 'check';
    control.checked = value === true;
    label.prepend(control);
  } else {
    control.value = type === 'json' ? JSON.stringify(value, null, 2) : value ?? '';
    if (['int', 'nonnegative', 'price'].includes(type)) control.inputMode = type === 'price' ? 'decimal' : 'numeric';
    label.append(control);
  }
  if (type === 'json') label.className = 'wide';
  return { label, control };
}

const weekdays = [
  ['mon','monday','星期一'], ['tue','tuesday','星期二'], ['wed','wednesday','星期三'],
  ['thu','thursday','星期四'], ['fri','friday','星期五'], ['sat','saturday','星期六'],
  ['sun','sunday','星期日']
];
const clockTime = /^(?:[01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$/;

function hoursField(def, value) {
  const fallback = field(def, value);
  const hasLongDays = isObject(value) && weekdays.some(([,long]) => Object.hasOwn(value, long));
  const dayKeys = weekdays.map(([short, long, title]) => [
    isObject(value) && Object.hasOwn(value, short) ? short : (hasLongDays ? long : short), title
  ]);
  const supported = isObject(value)
    && (!Object.keys(value).length || dayKeys.some(([key]) => Object.hasOwn(value, key)))
    && dayKeys.every(([key]) =>
    !Object.hasOwn(value, key) || (Array.isArray(value[key]) && value[key].every(span =>
      Array.isArray(span) && span.length === 2 && span.every(time => typeof time === 'string' && clockTime.test(time))
    ))
  );
  if (!supported) {
    fallback.label.append(element('small', '这家门店使用其他营业时间格式，请沿用现有 JSON。'));
    return fallback;
  }

  const panel = element('fieldset', undefined, 'hours wide');
  panel.append(element('legend', '营业时间'));
  panel.append(element('p', '填写如 12:00-15:00，19:00-23:30。逗号分隔多个时段，留空表示休息。', 'hint'));
  const grid = element('div', undefined, 'grid');
  const {control} = fallback;
  control.hidden = true;
  panel.append(grid, control);

  const days = dayKeys.map(([key, title]) => {
    const label = element('label', title);
    const input = element('input');
    input.type = 'text';
    input.value = (value[key] || []).map(span => span.join('-')).join('，');
    label.append(input);
    grid.append(label);
    return {key, title, input, initial:input.value};
  });

  grid.addEventListener('input', () => {
    const next = {...value};
    for (const {key, title, input, initial} of days) {
      if (input.value === initial) continue;
      const raw = input.value.trim();
      const spans = raw && raw !== '休息'
        ? raw.split(/[,，]/).map(part => part.split(/[-–—－]/).map(time => time.trim()))
        : [];
      if (spans.some(span => span.length !== 2 || !span.every(time => clockTime.test(time)))) {
        control.value = title + '的时间格式有误，请填写如 12:00-15:00。';
        control.dataset.hoursError = control.value;
        return;
      }
      next[key] = spans;
    }
    delete control.dataset.hoursError;
    control.value = JSON.stringify(next, null, 2);
  });
  control.addEventListener('hours-saved', () => {
    value = JSON.parse(control.value);
    for (const day of days) {
      day.initial = (value[day.key] || []).map(span => span.join('-')).join('，');
      day.input.value = day.initial;
    }
  });
  return {label:panel, control};
}

function readField(control, title, type) {
  if (type === 'bool') return control.checked;
  const raw = control.value.trim();
  if (type === 'required' && !raw) throw new Error(title + '不能为空。');
  if (type === 'json') {
    if (control.dataset.hoursError) throw new Error(control.dataset.hoursError);
    try { return JSON.parse(raw); }
    catch { throw new Error(title + '必须是有效的 JSON。'); }
  }
  if (!raw) return null;
  if (type === 'email' && control.validity.typeMismatch) throw new Error(title + '的格式有误。');
  if (type === 'url') {
    let url;
    try { url = new URL(raw); }
    catch { throw new Error(title + '必须填写完整网址。'); }
    if (!/^https?:\/\//i.test(raw) || url.username || url.password) {
      throw new Error(title + '必须是 HTTP 或 HTTPS 网址，且不能包含账号或密码。');
    }
  }
  if (type === 'price') {
    if (!/^\d{1,6}(?:[.,]\d{1,2})?$/.test(raw)) throw new Error(title + '请输入 0 至 999999.99，最多两位小数。');
    return Number(raw.replace(',', '.'));
  }
  if (type === 'int' || type === 'nonnegative') {
    const number = Number(raw);
    const min = type === 'int' ? -2147483648 : 0;
    if (!/^-?\d+$/.test(raw) || !Number.isInteger(number) || number < min || number > 2147483647) {
      throw new Error(title + (type === 'int' ? '必须是有效整数。' : '必须是有效的非负整数。'));
    }
    return number;
  }
  if (type === 'color' && !/^#[0-9a-f]{6}$/i.test(raw)) throw new Error(title + '请输入六位十六进制颜色，例如 #F5EFE8。');
  if (type === 'long') return control.value;
  return raw;
}

function editor(fields, initial, save, options = {}) {
  const form = element('form');
  form.noValidate = true;
  const grid = element('div', undefined, 'grid');
  const inputs = fields.map(def => {
    const {label, control} = def[0] === 'opening_hours'
      ? hoursField(def, initial[def[0]])
      : field(def, initial[def[0]]);
    grid.append(label);
    return {def, control, baseline:control.type === 'checkbox' ? control.checked : control.value};
  });
  const actions = element('div', undefined, 'actions');
  const button = element('button', options.button || '保存');
  const feedback = element('output');
  feedback.setAttribute('aria-live', 'polite');
  actions.append(button, feedback);
  form.append(grid, actions);

  function changed(input) {
    const {control, baseline} = input;
    return (control.type === 'checkbox' ? control.checked : control.value) !== baseline;
  }
  form.addEventListener('input', () => {
    if (inputs.some(changed)) dirty.add(form);
    else dirty.delete(form);
    feedback.textContent = '';
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!authorized || busy) return;
    const patch = Object.create(null);
    try {
      for (const input of inputs) {
        const {def:[key, title, type], control} = input;
        if (options.insert || changed(input)) patch[key] = readField(control, title, type);
      }
      if (!Object.keys(patch).length) {
        feedback.className = '';
        feedback.textContent = '没有需要保存的更改。';
        return;
      }
    } catch (error) {
      feedback.className = 'error';
      feedback.textContent = message(error);
      return;
    }
    setBusy(true);
    const controls = [...form.elements];
    controls.forEach(control => { control.disabled = true; });
    feedback.className = '';
    feedback.textContent = '正在保存…';
    try {
      await checkAdmin();
      const saved = await save(patch);
      if (!authorized) return;
      for (const input of inputs) {
        const [key, , type] = input.def;
        if (!Object.hasOwn(patch, key) && !options.insert) continue;
        const {control} = input;
        const value = saved[key];
        if (type === 'bool') control.checked = value === true;
        else control.value = type === 'json' ? JSON.stringify(value, null, 2) : value ?? '';
        if (key === 'opening_hours' && control.hidden) control.dispatchEvent(new Event('hours-saved'));
        input.baseline = type === 'bool' ? control.checked : control.value;
      }
      dirty.delete(form);
      feedback.textContent = '已保存。';
      if (options.onSaved) options.onSaved(saved);
    } catch (error) {
      feedback.className = 'error';
      feedback.textContent = message(error);
      if (!authorized) status(message(error), true);
    } finally {
      controls.forEach(control => { control.disabled = false; });
      setBusy(false);
    }
  });
  return form;
}

async function singleWrite(query) {
  const row = result(await query.select().maybeSingle());
  if (!row) throw new Error('未保存任何记录。请检查权限，或重新载入页面后再试。');
  return row;
}

function section(id, title) {
  const node = element('section');
  if (id) node.id = id;
  node.append(element('h2', title));
  return node;
}

function menuCard(storeId, menu, onInsert) {
  const card = element('article');
  const title = element('h3', menu ? menu.menu_type : '新增菜单');
  card.append(title);
  const initial = menu || {child_height:140, free_under_age:4, sort_order:0, enabled:true};
  let menuType = menu?.menu_type;
  card.append(editor(menuFields, initial, patch => singleWrite(menu
    ? db.from('menus').update(patch).eq('store_id', storeId).eq('menu_type', menuType)
    : db.from('menus').insert({...patch, store_id:storeId})), {
      insert:!menu,
      button:menu ? '保存菜单' : '新增菜单',
      onSaved(row) {
        if (!menu) {
          onInsert(row, card);
          return;
        }
        menuType = row.menu_type;
        title.textContent = row.menu_type;
      }
    }));
  return card;
}

async function loadStore(id) {
  const [storeResponse, menusResponse, settingsResponse] = await Promise.all([
    db.from('stores').select().eq('id', id).single(),
    db.from('menus').select().eq('store_id', id).order('sort_order').order('menu_type'),
    db.from('store_settings').select().eq('store_id', id).maybeSingle()
  ]);
  const store = result(storeResponse);
  const menus = result(menusResponse);
  const settings = result(settingsResponse);
  if (!authorized) return;
  const detailPanel = section('details', '门店资料与营业时间');
  detailPanel.append(editor([...details, ['opening_hours', '营业时间', 'json']], store,
    patch => singleWrite(db.from('stores').update(patch).eq('id', id)), {
      onSaved(row) {
        const option = Array.from($('store-select').options).find(item => item.value === id);
        if (option) option.textContent = row.name;
      }
    }));

  const menuPanel = section('menus', '菜单与价格');
  function addMenu(row, card) {
    const saved = menuCard(id, row, addMenu);
    card.replaceWith(saved, menuCard(id, null, addMenu));
    saved.prepend(element('p', '菜单已新增。', 'hint'));
  }
  menuPanel.append(...menus.map(menu => menuCard(id, menu, addMenu)), menuCard(id, null, addMenu));

  const settingsPanel = section('settings', '外卖、用餐规则与公告');
  let hasSettings = Boolean(settings);
  settingsPanel.append(editor(storeSettings, settings || {takeaway_enabled:true,announcement_enabled:false},
    async patch => {
      const query = hasSettings
        ? db.from('store_settings').update(patch).eq('store_id', id)
        : db.from('store_settings').insert({store_id:id,...patch});
      const row = await singleWrite(query);
      hasSettings = true;
      return row;
    }));

  for (const form of $('store-content').querySelectorAll('form')) dirty.delete(form);
  $('store-content').replaceChildren(detailPanel, menuPanel, settingsPanel);
  currentStore = id;
}

function isObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

async function loadSite() {
  const rows = result(await db.from('site_settings').select('key,value').in('key', ['social', 'appearance']));
  const panel = section(null, '全站社交与外观');
  panel.append(element('p', '此处使用 site_settings 的 social 和 appearance 两个键。顾客页面接入相同的键后才会显示这些设置。', 'hint'));
  for (const [key, title, fields] of [['social','社交链接',social], ['appearance','外观',appearance]]) {
    const group = element('article');
    group.append(element('h3', title));
    let row = rows.find(item => item.key === key);
    const editable = !row || isObject(row.value);
    if (!editable) {
      group.append(element('p', '已有设置采用其他 JSON 结构。已保留原值。', 'hint'));
      panel.append(group);
      continue;
    }
    const activeFields = fields.filter(([name]) => row?.value[name] == null || typeof row.value[name] === 'string');
    if (activeFields.length !== fields.length) group.append(element('p', '已有非文本字段将保留，其他字段可照常编辑。', 'hint'));
    group.append(editor(activeFields, row?.value || {}, async patch => {
      const value = {...row?.value, ...patch};
      const query = row
        ? db.from('site_settings').update({value}).eq('key', key).filter('value', 'eq', JSON.stringify(row.value))
        : db.from('site_settings').insert({key,value});
      row = await singleWrite(query);
      return row.value;
    }));
    panel.append(group);
  }
  if (authorized) $('site').replaceChildren(panel);
}

$('reset-email').addEventListener('click', async () => {
  if (!db || busy) return;
  const email = $('login-form').elements.email;
  if (!email.reportValidity()) return;
  if (window.location.protocol !== 'https:') {
    status('请在已发布的 HTTPS 后台页面申请重设密码。', true);
    return;
  }
  setBusy(true);
  try {
    const redirectTo = window.location.origin + window.location.pathname;
    result(await db.auth.resetPasswordForEmail(email.value.trim(), {redirectTo}));
    status('如果此邮箱已注册，Supabase 将发送重设密码邮件。请检查收件箱和垃圾邮件。');
  } catch (error) {
    status(message(error), true);
  } finally {
    setBusy(false);
  }
});

$('recovery-form').addEventListener('submit', async event => {
  event.preventDefault();
  if (!recovering || busy) return;
  const form = event.currentTarget;
  const password = form.elements.newPassword.value;
  if (password !== form.elements.confirmPassword.value) {
    status('两次输入的密码不一致。', true);
    return;
  }
  setBusy(true);
  try {
    await checkAdmin();
    result(await db.auth.updateUser({password}));
    form.reset();
    const {error} = await db.auth.signOut({scope:'local'});
    clearAdmin();
    status(error ? '密码已更新。请刷新页面，然后用新密码登录。' : '密码已更新，请用新密码登录。');
  } catch (error) {
    status(message(error), true);
  } finally {
    setBusy(false);
  }
});

$('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  if (!db || busy) return;
  const form = event.currentTarget;
  const email = form.elements.email.value.trim();
  const password = form.elements.password.value;
  setBusy(true);
  status('正在登录并核对管理员权限…');
  try {
    result(await db.auth.signInWithPassword({email,password}));
    await checkAdmin();
    authorized = true;
    const rows = result(await db.from('stores').select('id,name,sort_order').order('sort_order').order('id'));
    orderedStores.splice(0, orderedStores.length, ...rows);
    for (const row of orderedStores) $('store-select').append(new Option(row.name, row.id));
    await Promise.all([loadSite(), ...(rows.length ? [loadStore(rows[0].id)] : [])]);
    if (!authorized) return;
    $('login').hidden = true;
    $('logout').hidden = false;
    $('admin').hidden = false;
    status(rows.length ? '' : '数据库中暂无可管理的门店。');
  } catch (error) {
    clearAdmin();
    if (db) await db.auth.signOut({scope:'local'}).catch(() => {});
    status(message(error), true);
  } finally {
    form.elements.password.value = '';
    setBusy(false);
  }
});

$('store-select').addEventListener('change', async event => {
  const select = event.currentTarget;
  const next = select.value;
  if (busy || !authorized || !orderedStores.some(store => store.id === next)) {
    select.value = currentStore;
    return;
  }
  const hasDraft = [...dirty].some(form => $('store-content').contains(form));
  if (hasDraft && !confirm('切换门店会丢弃当前门店未保存的更改。继续吗？')) {
    select.value = currentStore;
    return;
  }
  setBusy(true);
  $('store-content').inert = true;
  status('正在加载门店…');
  try {
    await loadStore(next);
    status('');
  } catch (error) {
    select.value = currentStore;
    status(message(error), true);
  } finally {
    $('store-content').inert = false;
    setBusy(false);
  }
});

$('logout').addEventListener('click', async () => {
  if (busy || (dirty.size && !confirm('退出后会丢弃未保存的更改。继续吗？'))) return;
  setBusy(true);
  try {
    result(await db.auth.signOut({scope:'local'}));
    clearAdmin();
    status('已退出登录。');
  } catch (error) {
    clearAdmin();
    status('退出时遇到问题。本页已锁定，关闭或刷新后可清除本页会话。' + message(error), true);
  } finally {
    setBusy(false);
  }
});

window.addEventListener('beforeunload', event => {
  if (!dirty.size) return;
  event.preventDefault();
  event.returnValue = '';
});

try {
  if (!window.supabase?.createClient) throw new Error('无法加载 Supabase，请检查网络后刷新页面。');
  const fragment = new URLSearchParams(window.location?.hash.slice(1));
  const recoveryLink = fragment.get('type') === 'recovery';
  db = window.supabase.createClient(PROJECT_URL, PUBLISHABLE_KEY, {
    auth:{persistSession:false, autoRefreshToken:true, detectSessionInUrl:recoveryLink, flowType:'implicit'}
  });
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && recoveryLink && session) {
      recovering = true;
      $('login').hidden = true;
      $('recovery').hidden = false;
      status('');
    }
    if (event === 'SIGNED_OUT' && (authorized || recovering)) {
      clearAdmin();
      status('登录已结束，请重新登录。');
    }
  });
  $('login-button').disabled = false;
  $('reset-email').disabled = false;
  if (fragment.has('error_code')) {
    status('这条邮件链接已失效。请重新申请重设密码邮件。', true);
  }
} catch (error) {
  status(message(error), true);
}
</script>
