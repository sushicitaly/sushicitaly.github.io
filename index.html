<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Sushic Italy</title>

<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
<link rel="alternate icon" href="/favicon.ico?v=4">
<link rel="apple-touch-icon" href="/contact-logo.png.png?v=4">

  <!-- =========================
       GOOGLE ANALYTICS 4
       ========================= -->

  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-B30JEWQ1T8">
  </script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());

    gtag(
      "config",
      "G-B30JEWQ1T8"
    );
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background: #f7f7f5;
      color: #111;
    }

    .page {
      position: relative;

      width: 100%;
      max-width: 500px;

      margin: 0 auto;

      padding:
        70px
        24px
        40px;

      text-align: center;
    }


    /* =========================
       语言下拉菜单
       ========================= */

    .language-menu {
      position: absolute;

      top: 20px;
      right: 24px;

      z-index: 1000;

      text-align: left;
    }


    .language-current {
      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      min-width: 82px;

      padding:
        8px
        10px;

      background: #ffffff;

      border:
        1px
        solid
        #e5e5e5;

      border-radius: 10px;

      color: #333;

      font-family: inherit;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      box-shadow:
        0
        3px
        12px
        rgba(0,0,0,0.05);
    }


    .language-current:active {
      transform: scale(0.98);
    }


    .current-flag {
      font-size: 17px;
      line-height: 1;
    }


    .language-arrow {
      margin-left: 1px;

      color: #999;

      font-size: 9px;

      transition:
        transform
        0.2s
        ease;
    }


    .language-menu.open
    .language-arrow {
      transform: rotate(180deg);
    }


    /* 下拉框 */

    .language-dropdown {
      position: absolute;

      top:
        calc(100% + 7px);

      right: 0;

      width: 105px;

      padding: 6px;

      background: #ffffff;

      border:
        1px
        solid
        #e5e5e5;

      border-radius: 12px;

      box-shadow:
        0
        8px
        25px
        rgba(0,0,0,0.10);

      opacity: 0;
      visibility: hidden;

      transform:
        translateY(-5px);

      transition:
        opacity
        0.18s
        ease,

        transform
        0.18s
        ease,

        visibility
        0.18s
        ease;
    }


    .language-menu.open
    .language-dropdown {
      opacity: 1;

      visibility: visible;

      transform:
        translateY(0);
    }


    /* 下拉菜单语言 */

    .language-option {
      display: flex;

      align-items: center;

      gap: 9px;

      width: 100%;

      padding:
        10px
        9px;

      border: 0;

      border-radius: 8px;

      background: transparent;

      color: #333;

      font-family: inherit;

      font-size: 13px;
      font-weight: 500;

      text-align: left;

      cursor: pointer;
    }


    .language-option:hover {
      background: #f5f5f3;
    }


    .language-option.active {
      background: #f2f2f0;

      font-weight: 600;
    }


    .language-option
    .flag {
      font-size: 18px;
      line-height: 1;
    }


    /* =========================
       LOGO
       ========================= */

    .logo-wrap {
      width: 100%;

      display: flex;

      justify-content: center;

      margin-bottom: 28px;
    }


    .logo {
      display: block;

      width: 210px;

      max-width: 70%;

      height: auto;
    }


    /* =========================
       标题
       ========================= */

    h1 {
      font-size: 23px;

      margin:
        0
        0
        8px;

      font-weight: 600;
    }


    .subtitle {
      color: #777;

      font-size: 14px;

      margin-bottom: 55px;
    }


    /* =========================
       餐厅按钮
       ========================= */

    .restaurant {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      width: 100%;

      padding:
        27px
        24px;

      margin-bottom: 18px;

      background: #ffffff;

      color: #111111;

      text-decoration: none;

      border:
        1px
        solid
        #e7e7e7;

      border-radius: 16px;

      font-size: 17px;

      font-weight: 600;

      box-shadow:
        0
        5px
        20px
        rgba(0,0,0,0.05);
    }


    .restaurant:active {
      transform: scale(0.98);
    }


    .arrow {
      font-size: 22px;

      color: #999;
    }


    /* =========================
       Footer
       ========================= */

    footer {
      margin-top: 60px;

      font-size: 12px;

      color: #aaa;
    }

  </style>

</head>


<body>


<main class="page">


  <!-- =========================
       语言选择
       ========================= -->

  <div
    class="language-menu"
    id="languageMenu">


    <button
      class="language-current"
      type="button"
      onclick="toggleLanguageMenu(event)"
      aria-label="Select language">

      <span
        class="current-flag"
        id="currentFlag">
        🇮🇹
      </span>

      <span id="currentLanguage">
        IT
      </span>

      <span class="language-arrow">
        ▼
      </span>

    </button>


    <div class="language-dropdown">


      <!-- ITALIANO -->

      <button
        class="language-option"
        id="option-it"
        type="button"
        onclick="setLanguage('it')">

        <span class="flag">
          🇮🇹
        </span>

        <span>
          IT
        </span>

      </button>


      <!-- ENGLISH -->

      <button
        class="language-option"
        id="option-en"
        type="button"
        onclick="setLanguage('en')">

        <span class="flag">
          🇬🇧
        </span>

        <span>
          EN
        </span>

      </button>


      <!-- 中文 -->

      <button
        class="language-option"
        id="option-zh"
        type="button"
        onclick="setLanguage('zh')">

        <span class="flag">
          🇨🇳
        </span>

        <span>
          中文
        </span>

      </button>

    </div>

  </div>


  <!-- =========================
       SUSHIC LOGO
       ========================= -->

  <div class="logo-wrap">

    <img
      src="sushic-logo.png"
      alt="Sushic Asian Experience"
      class="logo">

  </div>


  <!-- =========================
       标题
       ========================= -->

  <h1 id="pageTitle">
    Scegli il ristorante
  </h1>


  <div
    class="subtitle"
    id="pageSubtitle">

    Seleziona la sede

  </div>


  <!-- =========================
       BIELLA
       ========================= -->

  <a
    class="restaurant"
    href="biella.html"
    onclick="trackRestaurant('biella')">

    <span>
      Sushic Biella
    </span>

    <span class="arrow">
      ›
    </span>

  </a>


  <!-- =========================
       CASSANO
       ========================= -->

  <a
    class="restaurant"
    href="cassano.html"
    onclick="trackRestaurant('cassano')">

    <span>
      Sushic Cassano
    </span>

    <span class="arrow">
      ›
    </span>

  </a>


  <footer>
    © Sushic Italy
  </footer>


</main>


<script>

  /* =========================
     翻译内容
     ========================= */

  const translations = {

    it: {

      title:
        "Scegli il ristorante",

      subtitle:
        "Seleziona la sede",

      languageName:
        "IT",

      flag:
        "🇮🇹"
    },


    en: {

      title:
        "Choose a restaurant",

      subtitle:
        "Select a location",

      languageName:
        "EN",

      flag:
        "🇬🇧"
    },


    zh: {

      title:
        "选择餐厅",

      subtitle:
        "请选择门店",

      languageName:
        "中文",

      flag:
        "🇨🇳"
    }

  };


  /* =========================
     自动检测手机 / 浏览器语言
     ========================= */

  function detectLanguage() {

    const browserLanguage =
      (
        navigator.languages &&
        navigator.languages[0]
      ) ||

      navigator.language ||

      "it";


    const language =
      browserLanguage
        .toLowerCase();


    if (
      language.startsWith("zh")
    ) {

      return "zh";

    }


    if (
      language.startsWith("en")
    ) {

      return "en";

    }


    if (
      language.startsWith("it")
    ) {

      return "it";

    }


    return "it";

  }


  /* =========================
     打开 / 关闭语言菜单
     ========================= */

  function toggleLanguageMenu(event) {

    event.stopPropagation();

    document
      .getElementById(
        "languageMenu"
      )
      .classList
      .toggle(
        "open"
      );

  }


  /* =========================
     应用语言
     ========================= */

  function applyLanguage(language) {

    const text =
      translations[language];


    document
      .getElementById(
        "pageTitle"
      )
      .textContent =
      text.title;


    document
      .getElementById(
        "pageSubtitle"
      )
      .textContent =
      text.subtitle;


    document
      .getElementById(
        "currentFlag"
      )
      .textContent =
      text.flag;


    document
      .getElementById(
        "currentLanguage"
      )
      .textContent =
      text.languageName;


    document.documentElement.lang =
      language === "zh"
        ? "zh-CN"
        : language;


    document
      .querySelectorAll(
        ".language-option"
      )
      .forEach(
        function(option) {

          option
            .classList
            .remove(
              "active"
            );

        }
      );


    document
      .getElementById(
        "option-" + language
      )
      .classList
      .add(
        "active"
      );

  }


  /* =========================
     用户手动选择语言
     ========================= */

  function setLanguage(language) {

    const previousLanguage =
      localStorage.getItem(
        "sushic-language"
      ) ||
      detectLanguage();


    localStorage.setItem(
      "sushic-language",
      language
    );


    applyLanguage(
      language
    );


    /* Google Analytics：
       记录主动切换语言 */

    if (
      previousLanguage !== language &&
      typeof gtag === "function"
    ) {

      gtag(
        "event",
        "language_change",
        {
          language_from:
            previousLanguage,

          language_to:
            language,

          page_type:
            "home"
        }
      );

    }


    document
      .getElementById(
        "languageMenu"
      )
      .classList
      .remove(
        "open"
      );

  }


  /* =========================
     点击门店统计
     ========================= */

  function trackRestaurant(
    restaurant
  ) {

    if (
      typeof gtag === "function"
    ) {

      gtag(
        "event",
        "restaurant_select",
        {
          restaurant:
            restaurant,

          language:
            localStorage.getItem(
              "sushic-language"
            ) ||
            detectLanguage()
        }
      );

    }

  }


  /* =========================
     点击菜单外部关闭菜单
     ========================= */

  document.addEventListener(
    "click",
    function(event) {

      const menu =
        document
          .getElementById(
            "languageMenu"
          );


      if (
        !menu.contains(
          event.target
        )
      ) {

        menu
          .classList
          .remove(
            "open"
          );

      }

    }
  );


  /* =========================
     页面打开时确定语言
     ========================= */

  const savedLanguage =
    localStorage.getItem(
      "sushic-language"
    );


  const initialLanguage =
    savedLanguage ||
    detectLanguage();


  applyLanguage(
    initialLanguage
  );

</script>


</body>
</html>
