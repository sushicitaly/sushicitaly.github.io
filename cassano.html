<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f5">

  <title>Sushic Cassano</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f7f7f5;
      color: #111;
    }

    .page {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 24px 50px;
    }

    .back {
      display: inline-block;
      margin-bottom: 45px;
      color: #777;
      text-decoration: none;
      font-size: 15px;
    }

    .header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .logo {
      display: block;
      width: 180px;
      max-width: 65%;
      height: auto;
    }

    .location {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #888;
    }

    .button {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 20px;
      margin-bottom: 14px;

      background: white;
      color: #111;
      text-decoration: none;

      border: 1px solid #e7e7e7;
      border-radius: 16px;

      box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    }

    .icon {
      width: 45px;
      font-size: 25px;
      text-align: center;
      margin-right: 14px;
    }

    .text {
      flex: 1;
    }

    .title {
      font-size: 17px;
      font-weight: 600;
    }

    .description {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }

    .arrow {
      color: #aaa;
      font-size: 22px;
    }

    .button:active {
      transform: scale(0.98);
    }

    footer {
      text-align: center;
      margin-top: 55px;
      color: #aaa;
      font-size: 12px;
    }

    /* Android 联系人下载提示 */
    .contact-toast {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;

      max-width: 460px;
      margin: 0 auto;

      background: #111;
      color: #fff;

      padding: 16px 18px;
      border-radius: 14px;

      font-size: 14px;
      line-height: 1.4;

      box-shadow: 0 8px 30px rgba(0,0,0,0.20);

      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;

      z-index: 9999;
    }

    .contact-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .contact-toast strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }
  </style>
</head>

<body>

<main class="page">

  <a class="back" href="index.html">‹ Scegli un altro ristorante</a>

  <div class="header">
    <div class="logo-wrap">
      <img src="sushic-logo.png" alt="Sushic Asian Experience" class="logo">
    </div>
    <div class="location">CASSANO</div>
  </div>

  <a class="button" href="menu-cassano.html">
    <div class="icon">🍣</div>
    <div class="text">
      <div class="title">Menu</div>
      <div class="description">Consulta i nostri menu</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button"
     href="https://maps.app.goo.gl/hta9JxhNLxUsiPXn6?g_st=ic"
     target="_blank"
     rel="noopener">
    <div class="icon">📍</div>
    <div class="text">
      <div class="title">Naviga</div>
      <div class="description">Indicazioni per il ristorante</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button" href="tel:+390331648325">
    <div class="icon">☎️</div>
    <div class="text">
      <div class="title">Chiama</div>
      <div class="description">Contatta il ristorante</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="button"
     href="cassano.vcf"
     download
     onclick="showContactHelp()">
    <div class="icon">👤</div>
    <div class="text">
      <div class="title">Salva contatto</div>
      <div class="description">Aggiungi Sushic Cassano ai contatti</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <footer>© Sushic Italy</footer>

</main>

<!-- Android 顶部提示 -->
<div id="contactToast" class="contact-toast">
  <strong>✓ Contatto scaricato</strong>
  Apri il file scaricato per salvarlo nei contatti.
</div>

<script>
function showContactHelp() {
  if (/Android/i.test(navigator.userAgent)) {

    const toast = document.getElementById("contactToast");

    toast.classList.add("show");

    setTimeout(function () {
      toast.classList.remove("show");
    }, 6000);
  }
}
</script>

</body>
</html>
